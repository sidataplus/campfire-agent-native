services:
  campfire:
    build:
      context: .
    env_file: .env
    environment:
      RAILS_ENV: production
      CAMPFIRE_PROXY_MODE: external
      PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - campfire-storage:/rails/storage
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3
volumes:
  campfire-storage:
